name: verify-oidc

# Manual proof that the bootstrap OIDC role works, no stored AWS key
# involved. Kept out of ci.yml, which must stay runnable with zero AWS
# credentials (see AC-templates.md "CI / dbt-run workflow changes").
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Verify identity (no stored key)
        run: aws sts get-caller-identity
