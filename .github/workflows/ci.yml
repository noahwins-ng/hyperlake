name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: make lint

      - name: Format check
        run: make format

      - name: Types
        run: make types

      - name: Test
        run: make test

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform check
        run: make tf-check

      - name: No long-lived AWS credentials
        run: |
          # Pattern built from parts so this step doesn't match its own source line.
          KEY_ID_VAR="AWS_ACCESS""_KEY_ID"
          SECRET_VAR="AWS_SECRET""_ACCESS_KEY"
          AKIA_KEY="AKIA[0-9A-Z]{16}"
          if grep -rEn --exclude-dir=.git --exclude-dir=.venv --exclude-dir=.terraform \
              "($KEY_ID_VAR|$SECRET_VAR|$AKIA_KEY)" .; then
            echo "long-lived AWS credential reference found — this repo uses OIDC only" >&2
            exit 1
          fi
