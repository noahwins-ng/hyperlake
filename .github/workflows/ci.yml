name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: make lint

      - name: Format check
        run: make format

      - name: Types
        run: make types

      - name: Test
        run: make test

      - name: Dependency audit
        run: make audit

      - name: dbt build (duckdb)
        run: make dbt-build

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform check
        run: make tf-check

      # Greps .tf source rather than a live `terraform plan` JSON: CI has no AWS credentials
      # (offline gate), and every banned resource type is unconditionally forbidden, so a
      # static source grep gives the same guarantee without needing a real plan.
      - name: Banned AWS services check
        run: |
          BANNED='aws_nat_gateway|aws_mwaa_environment|aws_msk_cluster|aws_opensearch_domain|aws_elasticsearch_domain|aws_quicksight_'
          if grep -rEn --include='*.tf' --exclude-dir=.terraform "$BANNED" infra/; then
            echo "banned AWS service resource type found under infra/ — see CLAUDE.md architecture rules" >&2
            exit 1
          fi

      # AC1 (QNT-457): the Fargate ingester runs in the default VPC via data sources
      # (data.aws_vpc/data.aws_subnets), never resources of our own (NFR-2). Same static-grep
      # rationale as the banned-services check above -- CI has no AWS credentials to run a
      # real `terraform plan`.
      - name: No VPC resources
        run: |
          BANNED='resource "aws_vpc"|resource "aws_subnet"|resource "aws_nat_gateway"|resource "aws_vpc_endpoint"'
          if grep -rEn --include='*.tf' --exclude-dir=.terraform "$BANNED" infra/; then
            echo "VPC resource found under infra/ — Fargate must use the default VPC via data sources, see CLAUDE.md NFR-2" >&2
            exit 1
          fi

      - name: Watchlist stays config-driven
        run: |
          uv run python -c "from hyperlake.watchlist import load_watchlist; print(chr(10).join(load_watchlist()))" > /tmp/watchlist_markets.txt
          if grep -rFwnf /tmp/watchlist_markets.txt --include='*.tf' --exclude-dir=.terraform infra/; then
            echo "watchlist market literal found under infra/** — must come from yamldecode(config/watchlist.yaml), never typed into .tf" >&2
            exit 1
          fi

      - name: No long-lived AWS credentials
        run: |
          # Pattern built from parts so this step doesn't match its own source line.
          KEY_ID_VAR="AWS_ACCESS""_KEY_ID"
          SECRET_VAR="AWS_SECRET""_ACCESS_KEY"
          AKIA_KEY="AKIA[0-9A-Z]{16}"
          if grep -rEn --exclude-dir=.git --exclude-dir=.venv --exclude-dir=.terraform \
              "($KEY_ID_VAR|$SECRET_VAR|$AKIA_KEY)" .; then
            echo "long-lived AWS credential reference found — this repo uses OIDC only" >&2
            exit 1
          fi
