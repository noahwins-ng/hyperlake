name: dbt-run

# QNT-454: `build` job is manual dispatch only, driven by scripts/gh_run.sh (session-down,
# heal, and the backfill runner all call it the same way). QNT-462 (ADR-002 amendment)
# adds the `seam` job below: automatic on every push to main (the Athena seam test's
# "required status" -- branch protection is unavailable on this private/Free repo, per
# CLAUDE.md, so this push trigger + a red run in Actions is the enforcement), and also
# dispatchable pre-merge from any branch via `-f job=seam` (the free escape hatch ADR-002
# describes). Failure notification: GitHub's own default run-failure email to the repo
# owner -- no bespoke notification infra exists or is needed for a single-owner repo.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_key:
        description: "Unique key gh_run.sh locates this run by (never 'latest' -- two dispatches can land seconds apart)"
        required: true
      select:
        description: "dbt --select argument (default: full build) -- build job only"
        required: false
        default: ""
      target:
        description: "dbt target -- build job only"
        required: false
        default: "athena"
      vars:
        description: "dbt --vars argument, as a JSON object string (QNT-460: make recon's per-session recon_session_id/window) -- build job only"
        required: false
        default: ""
      job:
        description: "Which job to run: build (default) or seam"
        required: false
        default: "build"

# Makes the run locatable by run_key via `gh run list --json displayTitle` -- the whole
# point of the completion contract (FR-8): "latest" is unsafe when two dispatches land
# seconds apart. Bare run_key (not prefixed) so gh_run.sh can match it exactly rather than
# by substring -- a prefix match would let one run_key that happens to be a substring of
# another (e.g. "dbt-run-100" of "dbt-run-1005") resolve to the wrong run.
run-name: "${{ inputs.run_key }}"

permissions:
  id-token: write
  contents: read

jobs:
  # A bad `job` value would otherwise make both `build`'s and `seam`'s `if` false --
  # zero jobs run, but nothing fails, so gh_run.sh's completion contract reports a false
  # green. Fail loud instead, matching this file's own `--select`-matches-nothing guard.
  validate-job-input:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: job must be build or seam
        run: |
          case "${{ inputs.job }}" in
            build | seam) ;;
            *)
              echo "::error::job must be 'build' or 'seam', got '${{ inputs.job }}'"
              exit 1
              ;;
          esac

  build:
    if: github.event_name == 'workflow_dispatch' && (inputs.job == '' || inputs.job == 'build')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --group dbt

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-northeast-1

      # dbt treats a --select that matches no nodes as a silent no-op (exit 0), which would
      # make a failing --select invisible to the run_key completion contract. Fail loud
      # instead, matching this repo's no-silent-nothing pattern (envelope drift, gap healing).
      - name: Resolve select
        if: inputs.select != ''
        working-directory: dbt
        env:
          TARGET: ${{ inputs.target }}
          SELECT: ${{ inputs.select }}
        run: |
          matched=$(uv run --group dbt dbt ls --profiles-dir . --target "$TARGET" --select "$SELECT" --output name --quiet)
          if [ -z "$matched" ]; then
            echo "::error::--select '$SELECT' matched no nodes"
            exit 1
          fi

      # QNT-460: regenerate dbt/seeds/session_gaps.csv from the real session's manifest
      # (already committed by session-down) before the build reads it -- must run on
      # this checkout, not the dispatching machine, which this runner never sees.
      - name: Regenerate session_gaps seed for a real recon session
        env:
          DBT_VARS: ${{ inputs.vars }}
        run: uv run python scripts/regen_recon_seed.py

      - name: dbt build
        working-directory: dbt
        env:
          DBT_ATHENA_S3_STAGING_DIR: ${{ vars.DBT_ATHENA_S3_STAGING_DIR }}
          DBT_ATHENA_WORKGROUP: hyperlake
          TARGET: ${{ inputs.target }}
          SELECT: ${{ inputs.select }}
          DBT_VARS: ${{ inputs.vars }}
        run: |
          uv run --group dbt dbt build --profiles-dir . --target "$TARGET" ${SELECT:+--select "$SELECT"} ${DBT_VARS:+--vars "$DBT_VARS"}

      - name: Upload run_results.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-run-results-${{ inputs.run_key }}
          path: dbt/target/run_results.json
          if-no-files-found: warn

  seam:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.job == 'seam')
    runs-on: ubuntu-latest
    env:
      DBT_ATHENA_S3_STAGING_DIR: ${{ vars.DBT_ATHENA_S3_STAGING_DIR }}
      DBT_ATHENA_WORKGROUP: hyperlake
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --group dbt

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Seed seam fixtures
        working-directory: dbt
        run: uv run --group dbt dbt seed --profiles-dir . --target athena --select tag:seam

      # Two dbt run invocations, not one: round 1 loads seam_fixture_round1 (creates the
      # Iceberg table on the very first-ever run; on every later push it's a MERGE back to
      # round 1's values -- static fixtures + the same update_condition make that
      # idempotent). Round 2 is the MERGE that actually exercises the three ordering
      # cases, from seam_fixture_round2 (ADR-002 amendment).
      - name: Round 1 -- reset to round-1 fixture values
        working-directory: dbt
        run: |
          uv run --group dbt dbt run --profiles-dir . --target athena --select seam_trades --vars '{seam_round: 1}'

      - name: Round 2 -- exercise the merge
        working-directory: dbt
        run: |
          uv run --group dbt dbt run --profiles-dir . --target athena --select seam_trades --vars '{seam_round: 2}'

      - name: Seam tests
        working-directory: dbt
        run: |
          uv run --group dbt dbt test --profiles-dir . --target athena --select tag:seam --vars '{seam_round: 2}'

      - name: Upload run_results.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-seam-results-${{ github.run_id }}
          path: dbt/target/run_results.json
          if-no-files-found: warn
