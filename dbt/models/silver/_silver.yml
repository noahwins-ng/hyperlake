version: 2

sources:
  - name: bronze
    schema: bronze
    tables:
      - name: trades_raw
        description: >
          Bronze envelope (append-only, plain Parquet, Hive partitions coin=/dt=/source=).
          On athena this is the real Glue table; on duckdb it resolves to the
          committed fixture dbt/fixtures/bronze_trades_sample.parquet, which contains
          duplicate `tid`s across `ws`/`backfill` sources to prove the dedup.
          `make dbt-demo-fail` points this at
          bronze_trades_demo_fail.parquet instead -- the same fixture plus one row with an
          invalid `side` ('X'), to show the red test + gold SKIP live.
        meta:
          external_location: "{{ 'fixtures/bronze_trades_demo_fail.parquet' if var('dbt_demo_fail', false) else 'fixtures/bronze_trades_sample.parquet' }}"

models:
  - name: trades
    description: >
      Silver, one row per trade, exactly-once on `tid`. Iceberg incremental merge on
      athena (ADR-002), bounded by `var('silver_lookback_days')`; plain table with
      row_number dedup on duckdb. `backfill` outranks `ws` on update (ADR-005,
      `source_rank`); `first_seen_source` is insert-only lineage (ADR-003).
    columns:
      - name: tid
        description: Trade id, the dedup key.
        data_type: bigint
        tests:
          - unique
          - not_null
      - name: coin
        description: Market symbol, from `config/watchlist.yaml`. HIP-3 markets keep their exact exchange name (e.g. `xyz:SP500`); only the `dt=` partition value normalises `:` to `_`.
        data_type: varchar
        tests:
          - not_null
      - name: side
        description: Taker side of the trade, `A` (ask/sell) or `B` (bid/buy).
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["A", "B"]
      - name: px
        description: Trade price, in the market's quote currency.
        data_type: decimal(18,8)
        tests:
          - not_null
      - name: sz
        description: Trade size, in the market's base units.
        data_type: decimal(18,6)
        tests:
          - not_null
      - name: time
        # duckdb preserves the envelope's tz-aware Parquet timestamp as `TIMESTAMP WITH
        # TIME ZONE`; Athena/Hive has no tz-aware timestamp type -- the Glue column is
        # plain `timestamp` (src/hyperlake/envelope.py's `_glue_type`). One contract,
        # per-target type, same pattern as materialization_for_target's target.type branch.
        description: Exchange event time (UTC), never arrival/`ingested_at`. Every `dt=` partition and every gold window derives from this column.
        data_type: "{{ 'timestamp with time zone' if target.type == 'duckdb' else 'timestamp' }}"
        tests:
          - not_null
      - name: hash
        description: Exchange-assigned transaction hash, when the source provides one; null otherwise.
        data_type: varchar
      - name: crossed
        description: True if the trade crossed the book (self-trade), when the source reports it.
        data_type: boolean
      - name: liquidation
        description: True if this trade was a liquidation. Only ever true on a backfill-sourced row (FR-4), the live WS feed carries no liquidation flag.
        data_type: boolean
      - name: fee
        description: Exchange fee charged on the trade, when the source reports it.
        data_type: decimal(18,6)
      - name: source
        description: Which acquisition path wrote this row before the merge, `ws` (live Fargate ingester) or `backfill` (archive Lambda).
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["ws", "backfill"]
      - name: source_rank
        description: Gates the merge's `update_condition`, a null rank here would silently break precedence. Backfill outranks ws (ADR-005).
        data_type: integer
        tests:
          - not_null
      - name: first_seen_source
        description: The source that first wrote this `tid` to bronze, insert-only lineage (ADR-003), never overwritten by a later update from the other source.
        data_type: varchar
        tests:
          - not_null
