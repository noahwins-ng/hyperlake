version: 2

models:
  - name: ohlcv_1m
    description: >
      Gold — 1-minute OHLCV candles per coin, bucketed on silver `time` only (NFR-5).
      `low <= open,close <= high` and `volume = sum(sz)` are proven by the singular tests
      `assert_ohlcv_bounds` / `assert_ohlcv_volume_reconciles` (dbt/tests/).
    columns:
      - name: coin
        tests:
          - not_null
      - name: bucket
        tests:
          - not_null
      - name: open
        tests:
          - not_null
      - name: high
        tests:
          - not_null
      - name: low
        tests:
          - not_null
      - name: close
        tests:
          - not_null
      - name: volume
        tests:
          - not_null
    tests:
      - unique:
          column_name: "coin || '|' || cast(bucket as varchar)"

  - name: ohlcv_1h
    description: Gold — 1-hour OHLCV candles per coin. Same grain/invariants as ohlcv_1m.
    columns:
      - name: coin
        tests:
          - not_null
      - name: bucket
        tests:
          - not_null
      - name: open
        tests:
          - not_null
      - name: high
        tests:
          - not_null
      - name: low
        tests:
          - not_null
      - name: close
        tests:
          - not_null
      - name: volume
        tests:
          - not_null
    tests:
      - unique:
          column_name: "coin || '|' || cast(bucket as varchar)"

  - name: ohlcv_1d
    description: Gold — 1-day OHLCV candles per coin. Same grain/invariants as ohlcv_1m.
    columns:
      - name: coin
        tests:
          - not_null
      - name: bucket
        tests:
          - not_null
      - name: open
        tests:
          - not_null
      - name: high
        tests:
          - not_null
      - name: low
        tests:
          - not_null
      - name: close
        tests:
          - not_null
      - name: volume
        tests:
          - not_null
    tests:
      - unique:
          column_name: "coin || '|' || cast(bucket as varchar)"

  - name: volume_daily
    description: Gold — total traded volume per coin per day, bucketed on silver `time` only.
    columns:
      - name: coin
        tests:
          - not_null
      - name: day
        tests:
          - not_null
      - name: volume
        tests:
          - not_null
    tests:
      - unique:
          column_name: "coin || '|' || cast(day as varchar)"

  - name: liquidations_daily
    description: >
      Gold — daily liquidation volume/count per coin. **Backfill-only by construction**
      (FR-4): the live WS feed carries no liquidation flag, so `liquidation` is only ever
      true on a row the backfill archive has upserted. This mart is therefore complete only
      for coin/day combinations inside an hour range the backfill has healed -- a day with
      unhealed hours will silently undercount, not error.
    columns:
      - name: coin
        tests:
          - not_null
      - name: day
        tests:
          - not_null
      - name: liquidation_volume
        tests:
          - not_null
      - name: liquidation_count
        tests:
          - not_null
    tests:
      - unique:
          column_name: "coin || '|' || cast(day as varchar)"
