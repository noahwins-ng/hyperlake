version: 2

models:
  - name: ohlcv_1m
    description: >
      Gold, 1-minute OHLCV candles per coin, bucketed on silver `time` only (NFR-5).
      `low <= open,close <= high` and `volume = sum(sz)` are proven by the singular tests
      `assert_ohlcv_bounds` / `assert_ohlcv_volume_reconciles` (dbt/tests/).
    columns:
      - name: coin
        description: Market symbol, from `config/watchlist.yaml` (see silver `trades.coin`).
        tests:
          - not_null
      - name: bucket
        description: Start of the 1-minute window (UTC), bucketed on silver `time` only, never arrival time.
        tests:
          - not_null
      - name: open
        description: Price of the first trade in the bucket, ordered by `time`.
        tests:
          - not_null
      - name: high
        description: Highest trade price in the bucket.
        tests:
          - not_null
      - name: low
        description: Lowest trade price in the bucket.
        tests:
          - not_null
      - name: close
        description: Price of the last trade in the bucket, ordered by `time`.
        tests:
          - not_null
      - name: volume
        description: Sum of trade size (`sz`) over the bucket.
        tests:
          - not_null
    tests:
      - unique:
          column_name: "coin || '|' || cast(bucket as varchar)"

  - name: ohlcv_1h
    description: Gold, 1-hour OHLCV candles per coin. Same grain/invariants as ohlcv_1m.
    columns:
      - name: coin
        description: Market symbol, from `config/watchlist.yaml` (see silver `trades.coin`).
        tests:
          - not_null
      - name: bucket
        description: Start of the 1-hour window (UTC), bucketed on silver `time` only, never arrival time.
        tests:
          - not_null
      - name: open
        description: Price of the first trade in the bucket, ordered by `time`.
        tests:
          - not_null
      - name: high
        description: Highest trade price in the bucket.
        tests:
          - not_null
      - name: low
        description: Lowest trade price in the bucket.
        tests:
          - not_null
      - name: close
        description: Price of the last trade in the bucket, ordered by `time`.
        tests:
          - not_null
      - name: volume
        description: Sum of trade size (`sz`) over the bucket.
        tests:
          - not_null
    tests:
      - unique:
          column_name: "coin || '|' || cast(bucket as varchar)"

  - name: ohlcv_1d
    description: Gold, 1-day OHLCV candles per coin. Same grain/invariants as ohlcv_1m.
    columns:
      - name: coin
        description: Market symbol, from `config/watchlist.yaml` (see silver `trades.coin`).
        tests:
          - not_null
      - name: bucket
        description: Start of the 1-day window (UTC), bucketed on silver `time` only, never arrival time.
        tests:
          - not_null
      - name: open
        description: Price of the first trade in the bucket, ordered by `time`.
        tests:
          - not_null
      - name: high
        description: Highest trade price in the bucket.
        tests:
          - not_null
      - name: low
        description: Lowest trade price in the bucket.
        tests:
          - not_null
      - name: close
        description: Price of the last trade in the bucket, ordered by `time`.
        tests:
          - not_null
      - name: volume
        description: Sum of trade size (`sz`) over the bucket.
        tests:
          - not_null
    tests:
      - unique:
          column_name: "coin || '|' || cast(bucket as varchar)"

  - name: volume_daily
    description: Gold, total traded volume per coin per day, bucketed on silver `time` only.
    columns:
      - name: coin
        description: Market symbol, from `config/watchlist.yaml` (see silver `trades.coin`).
        tests:
          - not_null
      - name: day
        description: Calendar day (UTC), bucketed on silver `time` only, never arrival time.
        tests:
          - not_null
      - name: volume
        description: Sum of trade size (`sz`) over the day.
        tests:
          - not_null
    tests:
      - unique:
          column_name: "coin || '|' || cast(day as varchar)"

  - name: liquidations_daily
    description: >
      Gold, daily liquidation volume/count per coin. **Backfill-only by construction**
      (FR-4): the live WS feed carries no liquidation flag, so `liquidation` is only ever
      true on a row the backfill archive has upserted. This mart is therefore complete only
      for coin/day combinations inside an hour range the backfill has healed -- a day with
      unhealed hours will silently undercount, not error.
    columns:
      - name: coin
        description: Market symbol, from `config/watchlist.yaml` (see silver `trades.coin`).
        tests:
          - not_null
      - name: day
        description: Calendar day (UTC), bucketed on silver `time` only, never arrival time.
        tests:
          - not_null
      - name: liquidation_volume
        description: Sum of trade size (`sz`) over the day's liquidation-flagged rows.
        tests:
          - not_null
      - name: liquidation_count
        description: Count of the day's liquidation-flagged rows.
        tests:
          - not_null
    tests:
      - unique:
          column_name: "coin || '|' || cast(day as varchar)"

unit_tests:
  # Pins dq_daily's arithmetic on fixed rows (duckdb only: the merge config and the median
  # function are the athena side of the seam, proven by the real dbt-run). BTC 2026-02-01:
  # 5 ws rows (tid 1 twice) + 3 backfill rows = 8 rows, 7 distinct (source, tid), so
  # duplicate_rate 1/8; tid 1 in both sources is overlap, not duplication. Backfill lags
  # 60/120/600 s, median 120. Gap minutes: BTC's own 5-minute gap plus the 10 minutes of the
  # coin-less gap that fall after midnight; the other 10 count toward 2026-01-31, and ETH's
  # 30-minute gap counts only toward ETH.
  - name: dq_daily_metric_arithmetic
    model: dq_daily
    config:
      enabled: "{{ target.type == 'duckdb' }}"
    given:
      - input: source('bronze', 'trades_raw')
        rows:
          - {tid: 1, coin: BTC, source: ws, time: "2026-02-01 10:00:00+00", ingested_at: "2026-02-01 10:00:01+00"}
          - {tid: 1, coin: BTC, source: ws, time: "2026-02-01 10:00:00+00", ingested_at: "2026-02-01 10:00:02+00"}
          - {tid: 2, coin: BTC, source: ws, time: "2026-02-01 11:00:00+00", ingested_at: "2026-02-01 11:00:01+00"}
          - {tid: 3, coin: BTC, source: ws, time: "2026-02-01 12:00:00+00", ingested_at: "2026-02-01 12:00:01+00"}
          - {tid: 4, coin: BTC, source: ws, time: "2026-02-01 13:00:00+00", ingested_at: "2026-02-01 13:00:01+00"}
          - {tid: 1, coin: BTC, source: backfill, time: "2026-02-01 10:00:00+00", ingested_at: "2026-02-01 10:01:00+00"}
          - {tid: 2, coin: BTC, source: backfill, time: "2026-02-01 11:00:00+00", ingested_at: "2026-02-01 11:02:00+00"}
          - {tid: 3, coin: BTC, source: backfill, time: "2026-02-01 12:00:00+00", ingested_at: "2026-02-01 12:10:00+00"}
          - {tid: 5, coin: BTC, source: backfill, time: "2026-01-31 23:59:00+00", ingested_at: "2026-01-31 23:59:30+00"}
          - {tid: 10, coin: ETH, source: ws, time: "2026-02-01 12:00:00+00", ingested_at: "2026-02-01 12:00:01+00"}
      - input: ref('session_gaps')
        rows:
          - {session_id: s1, coin: BTC, gap_start: "2026-02-01 10:00:00", gap_end: "2026-02-01 10:05:00"}
          - {session_id: s1, coin: null, gap_start: "2026-01-31 23:50:00", gap_end: "2026-02-01 00:10:00"}
          - {session_id: s1, coin: ETH, gap_start: "2026-02-01 12:00:00", gap_end: "2026-02-01 12:30:00"}
    expect:
      rows:
        - {dt: "2026-01-31", coin: BTC, ws_rows: 0, backfill_rows: 1, duplicate_rate: 0.0, gap_minutes: 10.0, median_archive_lag_seconds: 30.0}
        - {dt: "2026-02-01", coin: BTC, ws_rows: 5, backfill_rows: 3, duplicate_rate: 0.125, gap_minutes: 15.0, median_archive_lag_seconds: 120.0}
        - {dt: "2026-02-01", coin: ETH, ws_rows: 1, backfill_rows: 0, duplicate_rate: 0.0, gap_minutes: 40.0, median_archive_lag_seconds: null}
