version: 2

models:
  - name: recon_trades
    description: >
      G3 reconciliation ledger (ADR-003) -- one row per distinct `tid` seen in the
      window `var('recon_window_start')`..`var('recon_window_end')` for
      `var('recon_session_id')`, classified `ws_only` / `backfill_only` / `both`.
      `make recon` aggregates this into the session manifest's `recon` block; the
      singular tests `assert_ws_only_zero` and `assert_backfill_only_within_gaps`
      (dbt/tests/) are what actually prove G3.
    columns:
      - name: session_id
        description: The demo session this reconciliation row belongs to (`var('recon_session_id')`); scopes one `make recon` run to one session's window.
        tests:
          - not_null
      - name: tid
        description: Trade id being reconciled, one row per distinct `tid` seen in the window, deduped per source.
        tests:
          - not_null
      - name: coin
        description: Market symbol, from `config/watchlist.yaml` (see silver `trades.coin`).
        tests:
          - not_null
      - name: time
        description: Exchange event time (UTC) of the trade, never arrival/`ingested_at`.
        tests:
          - not_null
      - name: membership
        description: Which acquisition path(s) saw this `tid` in the window, `ws_only`, `backfill_only`, or `both`. `ws_only = 0` and every `backfill_only` inside a manifest-recorded gap is what proves G3 (ADR-003).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["ws_only", "backfill_only", "both"]
