version: 2

models:
  - name: dq_daily
    description: >
      Daily data-quality report per event day and coin, read from bronze so both acquisition
      paths stay visible. Reported, not alerted on. On athena each run recomputes the whole
      days inside `var('silver_lookback_days')` and merges them on (dt, coin). A coin and day
      with no bronze rows at all has no row.
    columns:
      - name: dt
        description: Event day (UTC) of the bronze rows, from exchange `time`, never arrival.
        tests:
          - not_null
      - name: coin
        description: Bronze's `coin`, the partition value on athena (`xyz_SP500`), the same key `session_gaps` uses.
        tests:
          - not_null
      - name: ws_rows
        description: Bronze rows written by the live feed (`source = 'ws'`), duplicates included.
        tests:
          - not_null
      - name: backfill_rows
        description: Bronze rows written by the archive backfill (`source = 'backfill'`).
        tests:
          - not_null
      - name: duplicate_rate
        description: Share of bronze rows that repeat a `tid` already held by the same source, `(rows - distinct (source, tid)) / rows`. A trade held once by each source is overlap, measured by recon, not duplication.
        tests:
          - not_null
      - name: gap_minutes
        description: Minutes of recorded WebSocket gap overlapping the day for this coin, from `session_gaps` (a null-coin gap counts for every coin), which a dbt-run.yml dispatch loads from every committed session manifest. Overlapping gaps are summed, not merged.
        tests:
          - not_null
      - name: median_archive_lag_seconds
        description: Median seconds from exchange `time` to `ingested_at` over the day's backfill rows; null with no backfill rows. For a day backfilled after the fact this measures when the backfill ran, not the archive's own delay.
    tests:
      - unique:
          column_name: "coin || '|' || cast(dt as varchar)"

unit_tests:
  # Pins dq_daily's arithmetic on fixed rows (duckdb only: the merge config and the median
  # function are the athena side of the seam, proven by the real dbt-run). BTC 2026-02-01:
  # 5 ws rows (tid 1 twice) + 3 backfill rows = 8 rows, 7 distinct (source, tid), so
  # duplicate_rate 1/8; tid 1 in both sources is overlap, not duplication. Backfill lags
  # 60/120/600 s, median 120. Gap minutes: BTC's own 5-minute gap plus the 10 minutes of the
  # coin-less gap that fall after midnight; the other 10 count toward 2026-01-31, and ETH's
  # 30-minute gap counts only toward ETH.
  - name: dq_daily_metric_arithmetic
    model: dq_daily
    config:
      enabled: "{{ target.type == 'duckdb' }}"
    given:
      # format: sql, the duckdb source is an external Parquet path dbt cannot introspect
      - input: source('bronze', 'trades_raw')
        format: sql
        rows: |
          select *
          from (values
              (1, 'BTC', 'ws', timestamptz '2026-02-01 10:00:00+00', timestamptz '2026-02-01 10:00:01+00'),
              (1, 'BTC', 'ws', timestamptz '2026-02-01 10:00:00+00', timestamptz '2026-02-01 10:00:02+00'),
              (2, 'BTC', 'ws', timestamptz '2026-02-01 11:00:00+00', timestamptz '2026-02-01 11:00:01+00'),
              (3, 'BTC', 'ws', timestamptz '2026-02-01 12:00:00+00', timestamptz '2026-02-01 12:00:01+00'),
              (4, 'BTC', 'ws', timestamptz '2026-02-01 13:00:00+00', timestamptz '2026-02-01 13:00:01+00'),
              (1, 'BTC', 'backfill', timestamptz '2026-02-01 10:00:00+00', timestamptz '2026-02-01 10:01:00+00'),
              (2, 'BTC', 'backfill', timestamptz '2026-02-01 11:00:00+00', timestamptz '2026-02-01 11:02:00+00'),
              (3, 'BTC', 'backfill', timestamptz '2026-02-01 12:00:00+00', timestamptz '2026-02-01 12:10:00+00'),
              (5, 'BTC', 'backfill', timestamptz '2026-01-31 23:59:00+00', timestamptz '2026-01-31 23:59:30+00'),
              (10, 'ETH', 'ws', timestamptz '2026-02-01 12:00:00+00', timestamptz '2026-02-01 12:00:01+00')
          ) as t (tid, coin, source, time, ingested_at)
      - input: ref('session_gaps')
        rows:
          - {session_id: s1, coin: BTC, gap_start: "2026-02-01 10:00:00", gap_end: "2026-02-01 10:05:00"}
          - {session_id: s1, coin: null, gap_start: "2026-01-31 23:50:00", gap_end: "2026-02-01 00:10:00"}
          - {session_id: s1, coin: ETH, gap_start: "2026-02-01 12:00:00", gap_end: "2026-02-01 12:30:00"}
    expect:
      rows:
        - {dt: "2026-01-31", coin: BTC, ws_rows: 0, backfill_rows: 1, duplicate_rate: 0.0, gap_minutes: 10.0, median_archive_lag_seconds: 30.0}
        - {dt: "2026-02-01", coin: BTC, ws_rows: 5, backfill_rows: 3, duplicate_rate: 0.125, gap_minutes: 15.0, median_archive_lag_seconds: 120.0}
        - {dt: "2026-02-01", coin: ETH, ws_rows: 1, backfill_rows: 0, duplicate_rate: 0.0, gap_minutes: 40.0, median_archive_lag_seconds: null}
