# Workflow profile — hyperlake. Read by the flow suite (ship-issue, session-check,
# cycle-start/end, sync-plan, change-scope, retro, ...). The skills' spine never changes;
# this file is the only thing that changes between projects.
# Convention: an empty ("") value means "this project has no such concept — skip that step".
#
# STATUS: pre-build (PRD v1.0 frozen 2026-09-05; QNT-444 toolchain branch open, no commits yet).
# verify.* and deploy gate probes are intentionally empty — see the TO-DERIVE comments below for
# which ticket unblocks each. architecture_rules / ac_execution_keywords / docs.ac_templates were
# re-derived 2026-09-05 (flow-tailor) from the frozen PRD — these don't need code to exist.

project:
  name: "Hyperlake"
  default_branch: main

tracker:
  # Native-first: the harness's Linear MCP tools when present; otherwise the shell adapter
  # (needs LINEAR_API_KEY).
  kind: linear
  identifier_regex: "QNT-\\d+"        # Quant team — shared with sibling projects
  identifier_example: "QNT-305"
  adapter: "adapters/linear.sh"
  get_issue:       "{adapter} issue get {id}"
  set_in_progress: "{adapter} issue status {id} 'In Progress'"
  set_in_review:   "{adapter} issue status {id} 'In Review'"
  set_done:        "{adapter} issue status {id} 'Done'"
  add_comment:     "{adapter} issue comment {id}"
  next_issue:      ""
  branch_from_issue: "branchName"
  branch_template:   "user/{id_lower}-{slug}"

vcs:
  commit_format: "{id}: {type}({scope}): {description}"   # {type} in feat|fix|refactor|test|docs|chore
  wip_commit:    "{id}: {type}({scope}): wip - {description}"
  commit_hook_note: "Enforced by .githooks/commit-msg — plain '{id}: wip:' is rejected; type(scope) required. Meta work may use bare 'docs:'/'chore:'."
  pr_title:  "{id}: {title}"
  pr_body_closes: "Closes {id}"
  pr_footer: ""                     # no tool-generated footers, ever

verify:
  # derived: QNT-444 toolchain (Makefile/pyproject.toml/ci.yml); mirrors ci.yml's `checks` job
  # step-for-step. Proven 2026-09-05 (this venv): lint/format/types/test all exit 0 clean.
  # test/tf-check will grow a dbt-duckdb build once QNT-446 lands the dbt skeleton — not yet,
  # so `make test` is pytest-only for now.
  lint:   "make lint"
  format: "make format"
  types:  "make types"
  test:   "make test"
  test_note: "pytest only until QNT-446 adds `dbt build --target duckdb` to the test target"
  # derived + proven 2026-09-05: `uv run pytest {path}` (single package, no monorepo split);
  # ran against tests/test_smoke.py, 1 passed.
  test_targeted: "uv run pytest {path}"
  # Empty, not a guess: no CVE/audit tool is wired as a synchronous gate (no pip-audit/uv audit
  # in the Makefile or ci.yml). dependabot.yml exists but is passive (opens PRs), not a `make`
  # target this profile can invoke. TO-DERIVE if/when a security scan step is added to ci.yml.
  security: ""

deploy:
  # Serverless-ephemeral topology (terraform apply/destroy per demo session) — there is no
  # long-lived "prod host". "Deployed" here means "a live session is up"; identity/health are
  # per-session, not per-merge — the closest analogue to deployed_sha is the commit SHA baked
  # into that session's ingester image and recorded in sessions/<id>.json.
  ci_status:    "gh pr checks {pr} --watch"
  merge:        "gh pr merge {pr} --squash --delete-branch"
  # TO-DERIVE(after QNT-457: Fargate ingester tagged by commit SHA): read the image tag/digest
  # off the running ECS task, or the sessions/<id>.json manifest once session-up writes it.
  deployed_sha: ""
  # TO-DERIVE(after QNT-457): ECS task ARN or equivalent for the live session's ingester.
  runtime_id:   ""
  # TO-DERIVE(after QNT-450: persistent layer + Athena workgroup exist): one cheap real query,
  # e.g. `SELECT count(*) FROM bronze.trades_raw LIMIT 1` via the Athena workgroup.
  health:       ""
  # Permanently empty, not deferred: ephemeral apply/destroy has no rollback concept — a bad
  # session is destroyed and re-applied, never rolled back in place.
  rollback:     ""

docs:
  plan:          "docs/project-plan.md"
  spec:          "docs/project-requirement.md"   # anchored to docs/prd.md (source PRD)
  patterns:      ""                              # none yet; add when code patterns emerge
  architecture:  "docs/architecture/system-overview.md"
  decisions_dir: "docs/decisions"
  adr_template:  "docs/decisions/TEMPLATE.md"
  adr_index:     "docs/INDEX.md"
  retros_dir:    "docs/retros"
  ac_templates:  "docs/AC-templates.md"

architecture_rules: |
  # derived: PRD v1.0 (frozen 2026-09-05) settled decisions + non-goals + CLAUDE.md invariants;
  # re-derived by flow-tailor 2026-09-05. No code exists yet to check these against — each is
  # provable the first time a matching file (infra/, dbt/, src/hyperlake/) lands.
  - No trading, signals, or execution anywhere — market data engineering only.
  - Ephemeral by design: no 24/7 operation; < $2/demo session, < $2/month idle (PRD G4).
    session-down, the session reaper, and the post-destroy audit are the enforcement — the
    AWS Budgets alarm is only a lagging backstop, never the primary guard.
  - Bronze is plain Parquet (Hive partitions); Iceberg exists only at silver/gold and is
    written exclusively by dbt-athena. No other Iceberg writer may appear in the codebase.
  - Backfill is plain-Python Lambda — no Glue Spark ETL.
  - Banned services (cost): NAT Gateway, MWAA, MSK provisioned, OpenSearch, QuickSight.
    Fargate runs with a public IP in a public subnet — no VPC plumbing beyond that.
  - Ingestion contract: at-least-once into bronze, exactly-once at silver (merge on tid,
    archive row outranks feed row on update — source_rank in ADR-005).
  - Event time everywhere: all timestamps UTC in storage; partition dt= and every gold window
    derive from exchange event time, never arrival/ingested_at.
  - Every AWS resource is Terraform-managed and tagged project=hyperlake; nothing hand-created.
  - No long-lived AWS keys in the repo or CI — GitHub Actions uses OIDC.
  - Watchlist is config-driven (config/watchlist.yaml) — no hardcoded market lists in code.
    HIP-3 markets keep their exact name in the coin column (xyz:SP500); the partition value
    is normalised ':' -> '_' by one shared helper, never ad hoc per call site.

ac_execution_keywords:
  - populated
  - backfill
  - "no duplicates"
  - returns
  - queryable
  - reconciles
  - deployed
  - destroyed        # teardown ACs must be executed, not eyeballed
  - "in athena"
  - visible
  - healthy

review:
  fresh_eyes_agent: "flow:flow-code-reviewer"

cadence:
  team:    "Quant"                 # Linear team (shared with sibling projects)
  project: "Hyperlake"             # Linear project — created by flow-plan-project
  active_cycle:   "{adapter} cycle active '{team}'"
  status_update:  "{adapter} project status-update '{project}'"

taxonomy:
  team_id: "6da338db-71b2-4d14-9519-8a19231e1ccd"   # Quant (filled by flow-plan-project 2026-09-04)
  labels:
    - infra
    - ingestion
    - lakehouse
    - docs
  ops_milestone: "Ops & Reliability"
  perpetual_milestones:
    - "Ops & Reliability"
  health_on_track_min: 0.50
  health_at_risk_min:  0.25

audit:
  # No long-lived server exists (serverless-ephemeral) — server-audit is disabled by design.
  # A cost/teardown audit variant may replace it later (see PRD FR-6/FR-7).
  host:            ""
  compose_file:    ""
  repo_path:       ""
  health_url:      ""
  expected_min_health_partition_free_pct: 20
